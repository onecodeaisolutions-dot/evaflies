<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EvaFlies — Reuniões</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">🎙️ <span>EvaFlies</span></div>
      <div id="userbar" class="userbar hidden"></div>
      <div class="sidebar-head">
        <h2>Reuniões</h2>
        <select id="owner-filter" class="owner-filter hidden"></select>
        <input id="search" type="text" placeholder="Buscar no título e na transcrição…" />
        <div class="filters">
          <input id="from" type="date" title="De" />
          <span class="filters-sep">→</span>
          <input id="to" type="date" title="Até" />
          <button id="clear-filters" title="Limpar filtros">✕</button>
        </div>
        <button id="resend-btn" class="resend-btn"
          title="Reenviar um áudio salvo (.webm) para transcrever — útil se a transcrição falhou no fim da reunião">
          ⬆️ Reenviar áudio salvo
        </button>
        <input id="resend-file" type="file" accept="audio/webm,audio/*,.webm" class="hidden" />
      </div>
      <div id="list" class="list"></div>
    </aside>

    <main id="detail" class="detail">
      <div class="empty">
        <h1>Selecione uma reunião</h1>
        <p>Cada reunião gravada pela extensão aparece na lista à esquerda, com a
          transcrição minuto a minuto e a gravação do áudio.</p>
      </div>
    </main>

    <template id="detail-template">
      <header class="detail-head">
        <div class="detail-head-top">
          <h1 class="title"></h1>
          <div class="detail-actions">
            <button class="btn-download" title="Baixar transcrição (.txt)">⬇️ Baixar</button>
            <button class="btn-rename" title="Renomear">✏️ Renomear</button>
            <button class="btn-delete" title="Excluir">🗑️ Excluir</button>
          </div>
        </div>
        <div class="meta"></div>
      </header>

      <audio class="player" controls preload="metadata"></audio>
      <div class="speed">
        <span class="speed-label">Velocidade</span>
        <button data-speed="1" class="speed-btn">1x</button>
        <button data-speed="1.25" class="speed-btn">1.25x</button>
        <button data-speed="1.5" class="speed-btn">1.5x</button>
        <button data-speed="1.75" class="speed-btn">1.75x</button>
        <button data-speed="2" class="speed-btn">2x</button>
      </div>
      <p class="no-audio hidden">Sem áudio salvo para esta reunião.</p>

      <nav class="tabs">
        <button data-tab="transcript" class="tab active">Transcrição</button>
        <button data-tab="summary" class="tab">Resumo</button>
      </nav>

      <section class="tab-panel" data-panel="transcript">
        <div class="transcript"></div>
      </section>

      <section class="tab-panel hidden" data-panel="summary">
        <div class="summary-text"></div>
        <h3>Action items</h3>
        <ul class="action-items"></ul>
        <div class="topics"></div>
      </section>
    </template>

    <div id="login" class="login-overlay hidden">
      <div class="login-box">
        <h1>🎙️ EvaFlies</h1>
        <p>Digite seu código de acesso para ver suas reuniões.</p>
        <input id="login-key" type="password" placeholder="Código de acesso" />
        <button id="login-btn">Entrar</button>
        <p id="login-error" class="login-error"></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
