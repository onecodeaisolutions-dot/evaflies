# Blueprint do Render. Em https://dashboard.render.com -> New -> Blueprint,
# aponte para este repositório. O Render lê este arquivo e cria o serviço.
services:
  - type: web
    name: evaflies-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false # você define o valor no painel do Render (secreto)
      - key: SUPABASE_URL
        sync: false # Project URL do Supabase
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # service_role key do Supabase (secreta)
      - key: SUPABASE_BUCKET
        value: meeting-audio
      - key: NODE_VERSION
        value: "22"
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: SUMMARY_MODEL
        value: gpt-4o-mini
      - key: TRANSCRIBE_LANGUAGE
        value: pt
      - key: CORS_ORIGIN
        value: "*"
      # Para PERSISTIR reuniões e áudios entre deploys, use um disco (plano pago):
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: evaflies-data
    #   mountPath: /var/data
    #   sizeGB: 1
